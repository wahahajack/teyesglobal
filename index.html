<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="TEYES" />

  <!-- Favicon & Manifest -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260306c" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260306c" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260306c" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#020817" />

  <!-- Preconnect for fonts (improves loading) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Optimized font loading with reduced weights -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" />
  </noscript>

  <!-- Robots meta is owned by src/components/SEO.tsx (react-helmet-async) so
       noindex pages (404, thank-you) never carry a conflicting duplicate. -->

  <!-- Critical CSS inline for faster FCP -->
  <style>
    body {
      background: hsl(222 47% 5%);
      color: hsl(210 40% 98%);
      font-family: system-ui, sans-serif;
    }

    .min-h-screen {
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MSPH5TMK"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
