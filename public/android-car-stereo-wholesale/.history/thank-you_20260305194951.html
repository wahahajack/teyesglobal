<body>
  <main class="section" style="min-height:100vh;display:flex;align-items:center;">
    <div class="container" style="max-width:780px;">
      <div class="form-card" style="text-align:center;">
        <h1 style="font-size:clamp(34px,6vw,54px);margin:0 0 10px;">Thank You</h1>
        <p class="section-sub" style="margin-bottom:18px;">Your request has been received. Our wholesale team will contact you within 24 hours.</p>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
          <a class="btn btn-primary" href="https://www.teyesglobal.com" target="_blank" rel="noopener">Back to Homepage</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: 'lead_submitted', page: 'thank_you' });

    if (typeof window.gtag === 'function') {
      window.gtag('event', 'conversion', { send_to: 'AW-XXXXXXX/XXXXXXXXXXX' });
    }

    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Lead');
    }
  </script>
