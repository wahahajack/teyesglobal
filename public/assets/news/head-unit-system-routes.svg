<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#101722"/><text x="80" y="110" font-family="Arial,sans-serif" font-size="46" font-weight="bold" fill="white">Start with the customer's goal</text><text x="80" y="170" font-family="Arial,sans-serif" font-size="26" fill="#b9c8d8">One request. Three routes to evaluate.</text><g font-family="Arial,sans-serif"><rect x="80" y="245" width="350" height="335" rx="22" fill="#233346"/><rect x="465" y="245" width="350" height="335" rx="22" fill="#233346"/><rect x="850" y="245" width="350" height="335" rx="22" fill="#233346"/><g fill="#62d4bd" font-size="24"><text x="110" y="298">01 / AUDIO</text><text x="495" y="298">02 / INTERFACE</text><text x="880" y="298">03 / BOTH</text></g><g fill="white" font-size="31" font-weight="bold"><text x="110" y="365">Keep the</text><text x="110" y="405">factory radio</text><text x="495" y="365">Replace the</text><text x="495" y="405">head unit</text><text x="880" y="365">Plan the</text><text x="880" y="405">whole system</text></g><g fill="#c5d2df" font-size="22"><text x="110" y="475">Assess the signal path</text><text x="110" y="510">and added equipment.</text><text x="495" y="475">Check the new interface</text><text x="495" y="510">and vehicle integration.</text><text x="880" y="475">Coordinate interface</text><text x="880" y="510">and audio changes.</text></g><text x="80" y="650" fill="#aabbcc" font-size="22">Verify the exact vehicle and configuration before quoting.</text></g></svg>